<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GameCoin</title>
  <desc id="desc">Play the market. Earn GME.</desc>
  <defs>
    <radialGradient id="glow">
      <stop stop-color="#ccff00" stop-opacity=".17"/>
      <stop offset="1" stop-color="#ccff00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ccff00" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#050805"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="955" cy="310" r="340" fill="url(#glow)"/>
  <image href="/gamecoin-logo-placeholder.svg" x="750" y="105" width="410" height="410"/>
  <text x="78" y="116" fill="#ccff00" font-family="monospace" font-size="18" letter-spacing="5">ROBINHOOD CHAIN / FLAP / PRELAUNCH</text>
  <text x="72" y="265" fill="#f3f5e9" font-family="Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-6">PLAY THE</text>
  <text x="72" y="358" fill="#ccff00" font-family="Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-6">MARKET.</text>
  <text x="78" y="435" fill="#f3f5e9" font-family="monospace" font-size="28">EARN GME.</text>
  <text x="78" y="528" fill="#98a390" font-family="Arial, sans-serif" font-size="22">The stock-powered game coin on Robinhood Chain.</text>
  <path d="M78 565H1122" stroke="#ccff00" stroke-opacity=".26"/>
